  const button=document.getElementById('unlock');
  const status=document.getElementById('status');
  if(!window.crypto?.subtle){status.textContent='A belépéshez HTTPS-en nyisd meg az oldalt egy friss böngészőben.';return;}
  button.disabled=true;
  status.textContent='Belépés folyamatban…';
  try{
    const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('password').value),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(payload.salt),iterations:payload.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
    const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(payload.iv)},key,bytes(payload.ciphertext));
    document.open();
    document.write(new TextDecoder().decode(plain));
    document.close();
  }catch(error){
    status.textContent='Hibás jelszó. Kérjük, próbáld újra.';
    document.getElementById('password').focus();
    button.disabled=false;
  }
});
</script>
</body></html>
